    select: nearest
    # Which tag the grasp is computed for.  -1 uses the rule above.  With a
    # tag on the object and another on the destination, 'nearest' is a coin
    # toss - name the object's id instead.  id 3 is on the object here.
    select_id: 1
    # The D405 is a short-range camera; anything it claims to see past half a
    # metre is a bad corner fit rather than an object.
    min_range_m: 0.07
    max_range_m: 0.60

    # Take the RANGE from the depth camera, the ORIENTATION from the tag.
    # A mis-printed marker is a scale error, not noise: it biases every range
    # by the same proportion, and a tolerance cannot correct a bias.  Depth
    # measures the range directly and does not care how big the tag is.
    range_from_depth: true

    # Report what marker size would reconcile the tag with the depth camera -
    # a free check on the print, per id.
    calibrate_size: true
    calibrate_frames: 30

    depth_cross_check: true
    depth_scale: 0.001
    depth_warn_m: 0.02

    # Tighter than the chest camera: up close the pose is good, so there is
    # no reason to accept as much wander before calling it settled.
    # --- measuring the object around the marker ---------------------------
    # The tag says WHERE to look; the depth image says what is there.  That
    # is the whole reason this is more robust than the blob detectors in this
    # package: they had to work out which lump was the target, and this does
    # not.
