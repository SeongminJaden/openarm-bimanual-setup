    # How far around the tag to look.  It only has to contain the object -
    # the connected-component step picks out the piece the tag is on, so
    # this no longer has to exclude the neighbours by itself, but a smaller
    # radius still costs less work.
    search_radius_m: 0.10
    object_max_height_m: 0.20
    surface_margin_m: 0.006
    min_object_points: 150
    # The tag is on the object's top face; the body hangs below it.
    marker_on_top: true

    # An object whose short side exceeds this cannot be grasped, and the node
    # says so instead of publishing a grasp that would close on nothing.
    # OpenArm's left finger opens to about 44 mm.
    # The widest object the jaws can span.  From the URDF the fingers
    # start 10 mm apart and each travels 44 mm, so the geometric limit is
    # 98 mm; 90 leaves room for the pads.  This is an OPENING, not the joint
    # value - the 0.040 that used to be here was the latter, and it refused
    # every object over 40 mm for no reason.
    gripper_max_m: 0.090
    grasp_clearance_m: 0.006

    # object_axis: publish a yaw about world Z from the measured long axis,
    # which is what pick_and_place expects - it adds 90 degrees itself to
    # close ACROSS the object.  marker: publish the tag's full orientation.
    orientation_mode: object_axis

    ema_alpha: 0.5
    stable_count: 4
    stable_tol_m: 0.005
    publish_debug_image: true

# ---------------------------------------------------------------------------
# reach_overlay: live "can the arm reach that?" drawn on the camera image.
#
#   ros2 run openarm_vision_pick reach_overlay --ros-args --params-file <this>
#   ros2 run rqt_image_view rqt_image_view /reach_overlay/image
#
# Sweeps /compute_ik over a grid once at start-up (under a minute), then
# judges each marker against that grid every frame.  Slide the object about
# until its circle turns green and the banner says BOTH REACHABLE.
#
# bench_z MUST be right: every cell is judged at bench_z + object_height/2,
# and a wrong bench height moves the whole map.  The detector publishes each
# tag's world pose - a tag lying flat on the bench reports the bench z.
# ---------------------------------------------------------------------------
reach_overlay:
  ros__parameters:
    use_sim_time: false

    color_topic: /chest/openarm_chest_camera/color/image_raw
    info_topic:  /chest/openarm_chest_camera/color/camera_info
    camera_frame: openarm_chest_camera_color_optical_frame
    poses_topic: /chest_marker_detector/poses
    ids_topic: /chest_marker_detector/ids
    planning_frame: world

    group: left_arm
    tcp_link: openarm_left_hand_tcp
    pick_id: 1
    place_id: 0

    # x min, max, step / y min, max, step.  Covers the whole region the
    # earlier sweep found reachable, with room around it.
    # Coarser than before: every lean tried multiplies the time spent on
    # cells that fail, and 5 cm is plenty for "slide it until it goes green"
    # - the pick itself re-checks IK at the exact spot.
    grid_x: [0.05, 0.45, 0.05]
    grid_y: [-0.10, 0.55, 0.05]
    yaws_deg: [0.0, 45.0, 90.0, 135.0]
    approach_height_m: 0.10
    ik_timeout_s: 0.02
    # Leans to try after straight down.  Same list as marker_pick.yaml, so
    # what the overlay calls reachable is what the pick will accept.
    tilt_deg: [0.0, 15.0, 30.0]

    # MEASURE THIS.  Read the z of a tag lying flat on the bench:
    #   ros2 topic echo /chest_marker_detector/poses --once
    bench_z: 0.20
    object_height_m: 0.040
    # Or pin the heights directly (0 = derive from the two above).
    grasp_z: 0.0
    place_z: 0.0
